name: release-tabid

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Ref to build, for example main, a tag, or a commit"
        required: true
        default: "main"
      release_tag:
        description: "GitHub Release tag, for example v3.0.0-tabid.1"
        required: true

env:
  TARGET_ARCH: "x86_64"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-linux-amd64:
    name: build linux amd64 tabid
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils build-essential curl jq patchelf python3

      - name: Build linux amd64 tabid glibc bundle
        env:
          LEDGER_ENABLED: "false"
        run: |
          set -euo pipefail
          mkdir -p dist
          BUNDLE_DIR="dist/tabid-linux-amd64-glibc"
          BUNDLE_NAME="$(basename "${BUNDLE_DIR}")"
          make build
          WASMVM_DIR="$(go list -f '{{.Dir}}' -m github.com/CosmWasm/wasmvm)"
          WASMD_DIR="$(go list -f '{{.Dir}}' -m github.com/CosmWasm/wasmd)"
          test -n "${WASMVM_DIR}"
          test -n "${WASMD_DIR}"
          test -f "${WASMVM_DIR}/internal/api/libwasmvm.${TARGET_ARCH}.so"
          test -f "${WASMD_DIR}/x/wasm/artifacts/v152/api/libwasmvm152.${TARGET_ARCH}.so"
          test -f "${WASMD_DIR}/x/wasm/artifacts/v155/api/libwasmvm155.${TARGET_ARCH}.so"
          mkdir -p "${BUNDLE_DIR}/lib"
          install -m 0755 build/tabid "${BUNDLE_DIR}/tabid"
          install -m 0644 "${WASMVM_DIR}/internal/api/libwasmvm.${TARGET_ARCH}.so" "${BUNDLE_DIR}/lib/"
          install -m 0644 "${WASMD_DIR}/x/wasm/artifacts/v152/api/libwasmvm152.${TARGET_ARCH}.so" "${BUNDLE_DIR}/lib/"
          install -m 0644 "${WASMD_DIR}/x/wasm/artifacts/v155/api/libwasmvm155.${TARGET_ARCH}.so" "${BUNDLE_DIR}/lib/"
          patchelf --set-rpath '$ORIGIN/lib' "${BUNDLE_DIR}/tabid"
          "${BUNDLE_DIR}/tabid" version >/dev/null
          tar -C dist -czf "dist/${BUNDLE_NAME}.tar.gz" "${BUNDLE_NAME}"

      - name: Smoke test glibc bundle
        run: |
          set -euo pipefail
          SMOKE_DIR="$(mktemp -d)"
          tar -C "${SMOKE_DIR}" -xzf dist/tabid-linux-amd64-glibc.tar.gz
          BUNDLE_DIR="${SMOKE_DIR}/tabid-linux-amd64-glibc"
          HOME_DIR="${SMOKE_DIR}/home"
          mkdir -p "${HOME_DIR}"
          test -x "${BUNDLE_DIR}/tabid"
          test -f "${BUNDLE_DIR}/lib/libwasmvm.x86_64.so"
          test -f "${BUNDLE_DIR}/lib/libwasmvm152.x86_64.so"
          test -f "${BUNDLE_DIR}/lib/libwasmvm155.x86_64.so"
          readelf -d "${BUNDLE_DIR}/tabid" | grep -F '$ORIGIN/lib'
          ldd "${BUNDLE_DIR}/tabid" | tee "${SMOKE_DIR}/ldd.txt"
          awk -v expected="${BUNDLE_DIR}/lib/libwasmvm.x86_64.so" '$1 == "libwasmvm.x86_64.so" { if ($3 != expected) exit 1; found=1 } END { exit(found ? 0 : 1) }' "${SMOKE_DIR}/ldd.txt"
          awk -v expected="${BUNDLE_DIR}/lib/libwasmvm152.x86_64.so" '$1 == "libwasmvm152.x86_64.so" { if ($3 != expected) exit 1; found=1 } END { exit(found ? 0 : 1) }' "${SMOKE_DIR}/ldd.txt"
          awk -v expected="${BUNDLE_DIR}/lib/libwasmvm155.x86_64.so" '$1 == "libwasmvm155.x86_64.so" { if ($3 != expected) exit 1; found=1 } END { exit(found ? 0 : 1) }' "${SMOKE_DIR}/ldd.txt"
          env -i PATH="${PATH}" HOME="${HOME_DIR}" LD_LIBRARY_PATH= "${BUNDLE_DIR}/tabid" version >/dev/null

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum tabid-linux-amd64-glibc.tar.gz > tabid-linux-amd64-glibc.tar.gz.sha256
          sha256sum tabid-linux-amd64-glibc.tar.gz > SHA256SUMS

      - name: Generate release manifest
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          python3 ./scripts/generate-tabid-release-manifest.py \
            --artifact ./dist/tabid-linux-amd64-glibc.tar.gz \
            --release-tag "${RELEASE_TAG}" \
            --source-ref "${SOURCE_REF}" \
            --source-commit "${SOURCE_COMMIT}" \
            --workflow "${WORKFLOW_NAME}" \
            --workflow-run-id "${RUN_ID}" \
            --workflow-run-attempt "${RUN_ATTEMPT}" \
            --source-repo "${GITHUB_REPOSITORY}" \
            --platform "linux/amd64" \
            --checksum-file "SHA256SUMS" \
            --out ./dist/release-manifest.json

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tabid-linux-amd64-release
          path: |
            dist/tabid-linux-amd64-glibc.tar.gz
            dist/tabid-linux-amd64-glibc.tar.gz.sha256
            dist/SHA256SUMS
            dist/release-manifest.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist/tabid-linux-amd64-glibc.tar.gz
            dist/SHA256SUMS
            dist/release-manifest.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          NOTES_FILE="$(mktemp)"
          cat > "${NOTES_FILE}" <<EOF
          Automated tabid release from ${{ github.repository }} @ ${{ inputs.source_ref }}
          EOF
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              dist/tabid-linux-amd64-glibc.tar.gz \
              dist/tabid-linux-amd64-glibc.tar.gz.sha256 \
              dist/SHA256SUMS \
              dist/release-manifest.json \
              --clobber
          else
            gh release create "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes-file "${NOTES_FILE}" \
              dist/tabid-linux-amd64-glibc.tar.gz \
              dist/tabid-linux-amd64-glibc.tar.gz.sha256 \
              dist/SHA256SUMS \
              dist/release-manifest.json
          fi
